<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FX_CHECKER — Currency Converter & Exchange Rates</title>
  
  <!-- Fontes Google: JetBrains Mono para valores técnicos/monetários e Inter para interface geral -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/style.css">
</head>
<body class="app-body">
  <div class="app-layout">
    <!-- BARRA SUPERIOR: BRAND & TICKER -->
    <header class="app-header">
      <div class="brand-row">
        <div class="brand-logo">
          <span class="brand-tag">//</span>
          <span class="brand-title">FX_CHECKER</span>
        </div>
        <div class="brand-meta-desktop">
          <span>55 CURRENCIES · EOD · ECB DATA</span>
        </div>
      </div>

      <!-- TICKER CONTAINER -->
      <div id="header-ticker-root" class="ticker-root-container"></div>
    </header>

    <!-- CONTAINER PRINCIPAL -->
    <main class="main-container">
      <!-- CARD CONVERSOR PRINCIPAL (CHECK THE RATE) -->
      <section id="converter-card-root" class="converter-section" aria-label="Currency converter card"></section>

      <!-- NAVEGAÇÃO DE ABAS (DESKTOP & TABLET) -->
      <nav class="tabs-nav-bar desktop-tabs-bar" aria-label="Navigation Tabs">
        <button class="nav-tab-btn is-active" data-tab="history">HISTORY</button>
        <button class="nav-tab-btn" data-tab="compare">COMPARE</button>
        <button class="nav-tab-btn" data-tab="favorites">
          FAVORITES <span class="tab-badge" id="fav-count-badge">10</span>
        </button>
        <button class="nav-tab-btn" data-tab="log">
          LOG <span class="tab-badge" id="log-count-badge">8</span>
        </button>
      </nav>

      <!-- SELETOR DE ABAS MOBILE (ACCORDION / DROPDOWN DO DESIGN) -->
      <div class="mobile-tabs-dropdown-wrapper">
        <button class="mobile-tabs-trigger" id="mobile-tabs-dropdown-btn">
          <span id="mobile-tab-trigger-label">HISTORY</span>
          <svg class="dropdown-arrow-icon" viewBox="0 0 24 24">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="mobile-tabs-menu hidden" id="mobile-tabs-menu">
          <button class="mobile-tab-opt" data-tab="history">HISTORY</button>
          <button class="mobile-tab-opt" data-tab="compare">COMPARE</button>
          <button class="mobile-tab-opt" data-tab="favorites">
            FAVORITES <span class="mobile-badge" id="mobile-fav-badge">10</span>
          </button>
          <button class="mobile-tab-opt" data-tab="log">LOG</button>
        </div>
      </div>

      <!-- CONTEÚDO DAS ABAS -->
      <div class="tab-panels-wrapper">
        <!-- ABA 1: HISTORY -->
        <section id="history-tab-content" class="tab-panel"></section>

        <!-- ABA 2: COMPARE -->
        <section id="compare-tab-content" class="tab-panel hidden"></section>

        <!-- ABA 3: FAVORITES -->
        <section id="favorites-tab-content" class="tab-panel hidden"></section>

        <!-- ABA 4: LOG -->
        <section id="log-tab-content" class="tab-panel hidden"></section>
      </div>
    </main>

    <!-- FOOTER SUTIL -->
    <footer class="app-footer">
      <span>FX_CHECKER · European Central Bank (ECB) Reference Rates · Private Client Storage</span>
    </footer>
  </div>

  <!-- MODAL / POPOVER DO CURRENCY PICKER -->
  <div id="currency-picker-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true"></div>

  <!-- SCRIPT PRINCIPAL -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
